[project]
name = "payments-processing-service"
version = "0.1.0"
description = "Async payment processing service with outbox and webhook retry chain"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
